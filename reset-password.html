<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña – RutaLibre</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0A0E1A;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #111827;
      border: 1px solid #1F2937;
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
    }
    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }
    .logo span { color: #1A56FF; }
    .subtitle {
      text-align: center;
      color: #6B7280;
      font-size: 14px;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #D1D5DB;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      background: #1F2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 14px 16px;
      color: #FFFFFF;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 16px;
    }
    input:focus { border-color: #1A56FF; }
    button {
      width: 100%;
      background: #1A56FF;
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    button:hover { background: #0D3ACC; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      text-align: center;
      font-size: 14px;
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 8px;
      display: none;
    }
    .msg.error { background: rgba(239,68,68,0.1); color: #F87171; border: 1px solid rgba(239,68,68,0.2); display: block; }
    .msg.success { background: rgba(34,197,94,0.1); color: #4ADE80; border: 1px solid rgba(34,197,94,0.2); display: block; }
    .back {
      display: block;
      text-align: center;
      color: #6B7280;
      font-size: 13px;
      margin-top: 20px;
      text-decoration: none;
    }
    .back:hover { color: #9CA3AF; }
    .icon { font-size: 40px; text-align: center; margin-bottom: 16px; }
  </style>
</head>
<body>

<div class="card">
  <div class="icon">🔐</div>
  <div class="logo">Ruta<span>Libre</span></div>
  <p class="subtitle">Crea tu nueva contraseña</p>

  <div id="form-section">
    <label for="password">Nueva contraseña</label>
    <input type="password" id="password" eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljeGJubHNhY3Z1d25mcnNjaWZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODc4MzUsImV4cCI6MjA5MzY2MzgzNX0.FC124pkstpko4lFGVkMno5QZnKAz4wuXhabyc8UoVKA="Mínimo 6 caracteres" />

    <label for="confirm">Confirmar contraseña</label>
    <input type="password" id="confirm" eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljeGJubHNhY3Z1d25mcnNjaWZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODc4MzUsImV4cCI6MjA5MzY2MzgzNX0.FC124pkstpko4lFGVkMno5QZnKAz4wuXhabyc8UoVKA="Repite la contraseña" />

    <button id="btn" onclick="resetPassword()">Guardar nueva contraseña</button>
    <div id="msg" class="msg"></div>
  </div>

  <div id="success-section" style="display:none; text-align:center;">
    <div style="font-size:48px; margin-bottom:16px;">✅</div>
    <p style="font-size:17px; font-weight:600; margin-bottom:8px;">¡Contraseña actualizada!</p>
    <p style="color:#6B7280; font-size:14px;">Ya puedes iniciar sesión en la app RutaLibre con tu nueva contraseña.</p>
  </div>

  <a class="back" href="https://luisqueb2.github.io/Rutalibre-web/">← Volver al inicio</a>
</div>

<script>
  const { createClient } = supabase;
  const sb = createClient(
    'https://icxbnlsacvuwnfrscifg.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImljemJubHNhY3Z1d25mcnNjaWZnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDY1NDYyMzUsImV4cCI6MjA2MjEyMjIzNX0.3TP2BSNJFJ5PBr9Z7lmNHRBSQhJHE2Py0EbKNbJxkMA'
  );

  async function resetPassword() {
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    msg.className = 'msg';
    msg.textContent = '';

    if (!password || !confirm) {
      msg.className = 'msg error';
      msg.textContent = 'Completa todos los campos.';
      return;
    }
    if (password.length < 6) {
      msg.className = 'msg error';
      msg.textContent = 'La contraseña debe tener al menos 6 caracteres.';
      return;
    }
    if (password !== confirm) {
      msg.className = 'msg error';
      msg.textContent = 'Las contraseñas no coinciden.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Guardando...';

    const { error } = await sb.auth.updateUser({ password });

    if (error) {
      msg.className = 'msg error';
      msg.textContent = 'Error: ' + error.message;
      btn.disabled = false;
      btn.textContent = 'Guardar nueva contraseña';
    } else {
      document.getElementById('form-section').style.display = 'none';
      document.getElementById('success-section').style.display = 'block';
    }
  }
</script>

</body>
</html>
